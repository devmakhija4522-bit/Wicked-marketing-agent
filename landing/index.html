<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WICKED — Command A Fleet Of Marketing Agents</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:ital,wght@0,400;0,600;1,500;1,600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          heading: ["'Bricolage Grotesque'", "sans-serif"],
          body: ["Inter", "sans-serif"],
        },
      },
    },
  };
</script>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script crossorigin src="https://unpkg.com/framer-motion@11/dist/framer-motion.js"></script>
<script>
  // framer-motion's UMD build exposes window.Motion — alias for convenience.
  window.addEventListener("DOMContentLoaded", () => {
    if (!window.Motion && window.framerMotion) window.Motion = window.framerMotion;
  });
</script>

<style>
  html, body { background: #000; margin: 0; overflow-x: hidden; }
  body { font-family: "Inter", sans-serif; }

  .liquid-glass {
    position: relative;
    background: rgba(255, 255, 255, 0.06);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 4px 24px rgba(0, 0, 0, 0.35);
  }
  .liquid-glass::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 1px;
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.35), rgba(255, 255, 255, 0.04) 40%, rgba(255, 255, 255, 0.18));
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
  }
  .liquid-glass-strong {
    position: relative;
    background: rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12), 0 4px 24px rgba(0, 0, 0, 0.4);
  }
  .liquid-glass-strong::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 1px;
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.5), rgba(255, 255, 255, 0.08) 40%, rgba(255, 255, 255, 0.25));
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
  }

  /* Crimson-edged liquid glass — footer only, tinted toward the WICKED
     brand accent instead of neutral white so the glass edge reads as
     "WICKED" rather than generic. */
  .liquid-glass-crimson {
    position: relative;
    background: rgba(255, 255, 255, 0.06);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 4px 24px rgba(0, 0, 0, 0.35);
  }
  .liquid-glass-crimson::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 1.4px;
    background: linear-gradient(180deg,
      rgba(233,69,96,0.45) 0%, rgba(233,69,96,0.15) 20%,
      rgba(255,255,255,0) 40%, rgba(255,255,255,0) 60%,
      rgba(233,69,96,0.15) 80%, rgba(233,69,96,0.45) 100%);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
  }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }
</style>
</head>
<body>
<div id="root"></div>

<script>
  // Fetch + transform + eval every component file ourselves, in a fixed
  // order, instead of using several <script type="text/babel" src="...">
  // tags — Babel Standalone fetches those asynchronously, so their
  // execution order (and therefore whether App.js's immediate render()
  // call sees fully-defined globals) is not guaranteed.
  const SOURCE_FILES = [
    "./components/icons.js",
    "./components/BlurText.js",
    "./components/FadingVideo.js",
    "./components/Navbar.js",
    "./components/Hero.js",
    "./components/Capabilities.js",
    "./components/Footer.js",
    "./App.js",
  ];

  (async () => {
    try {
      const sources = [];
      for (const file of SOURCE_FILES) {
        const res = await fetch(file);
        if (!res.ok) throw new Error(`Failed to fetch ${file}: ${res.status}`);
        sources.push(`// --- ${file} ---\n${await res.text()}`);
      }
      const combined = sources.join("\n\n");
      // Force the classic runtime — the automatic runtime injects an
      // `import` from "react/jsx-runtime", which is invalid inside eval().
      // Classic emits React.createElement(...) against the global React
      // from the CDN <script> tag instead.
      const { code } = Babel.transform(combined, {
        presets: [["react", { runtime: "classic" }]],
      });
      (0, eval)(code);
    } catch (err) {
      console.error(err);
      document.getElementById("root").innerHTML =
        '<pre style="color:#fff;background:#300;padding:2rem;white-space:pre-wrap;font-family:monospace;">' +
        "Landing page failed to load:\n" + (err && err.stack ? err.stack : err) +
        "</pre>";
    }
  })();
</script>
</body>
</html>
